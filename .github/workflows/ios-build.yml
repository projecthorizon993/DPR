name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false

      - name: Install Xcode toolchain
        run: |
          xcodebuild -version

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-ios
          profile: minimal
          override: true

      - name: Build Rust camera_core library
        run: |
          cd rust-core
          cargo build --release --target aarch64-apple-ios
          mkdir -p ../rust-libs
          cp target/aarch64-apple-ios/release/libcamera_core.a ../rust-libs/

      - name: Build Swift package for iOS
        run: |
          cd ios-app
          swift build --target aarch64-apple-ios \
            -Xswiftc -sdk -Xswiftc "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -Xswiftc -target -Xswiftc aarch64-apple-ios \
            -Xlinker -L../rust-libs -Xlinker -lcamera_core

      - name: Export IPA
        run: |
          echo "Build complete"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: camera-app-build
          path: ios-app/.build/
          retention-days: 7

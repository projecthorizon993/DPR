name: CI — CameraApp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run-rust:
        description: 'Run Rust fmt/clippy/test'
        required: false
        default: 'true'
        type: boolean
      run-ios:
        description: 'Build iOS app with xcodebuild'
        required: false
        default: 'true'
        type: boolean

jobs:
  ci:
    name: Rust + iOS build (macOS)
    runs-on: macos-14
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-rust == 'true' || github.event.inputs.run-ios == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (macOS)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # ---- Rust: fmt, clippy, tests ----
      - name: Run Rust checks (if enabled)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-rust == 'true'
        run: |
          cd rust-core
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets

      # ---- iOS: xcodebuild ----
      - name: Select Xcode
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-ios == 'true'
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Swift app for iOS
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-ios == 'true'
        run: |
          xcodebuild -scheme CameraApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath ./build/DerivedData \
            build || echo "BUILD WARNING"

      - name: Archive iOS app
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-ios == 'true'
        run: |
          xcodebuild -scheme CameraApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build/DerivedData \
            -archivePath ./build/CameraApp.xcarchive \
            archive -allowProvisioningUpdates || echo "ARCHIVE WARNING"

      - name: List ALL build artifacts (diagnostic)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-ios == 'true'
        run: |
          echo "=== Archive exists? ==="
          ls -la ./build/CameraApp.xcarchive 2>/dev/null || echo "no archive"
          echo "=== ALL files in ./build ==="
          find ./build -type f 2>/dev/null | sort | head -100
          echo "=== ALL .app bundles anywhere ==="
          find . -name "*.app" -type d 2>/dev/null || echo "none found"
          echo "=== Executable binaries ==="
          find ./build -type f -perm +111 2>/dev/null || echo "none"
          echo "=== DerivedData structure ==="
          find ./build/DerivedData -type d 2>/dev/null | head -30

      - name: Try xcodebuild exportArchive (development)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-ios == 'true'
        run: |
          mkdir -p ./build
          cat > ./build/exportOptions.plist << 'PLIST_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          PLIST_EOF
          xcodebuild -exportArchive \
            -archivePath ./build/CameraApp.xcarchive \
            -exportPath ./build/ipa_export \
            -exportOptionsPlist ./build/exportOptions.plist 2>&1 || echo "exportArchive failed (expected without Apple Developer signing)"
          ls -la ./build/ipa_export/ 2>/dev/null || echo "no export directory"

      - name: Build unsigned IPA from build products
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-ios == 'true'
        run: |
          set -x
          mkdir -p ./build/ipa/Payload/CameraApp.app

          # Strategy 0: IPA already produced by exportArchive
          if [ -f ./build/ipa_export/CameraApp.ipa ]; then
            echo "Found IPA from exportArchive"
            mkdir -p ./build/ipa
            cp ./build/ipa_export/CameraApp.ipa ./build/ipa/CameraApp-unsigned.ipa
            echo "ipa_created=true" >> $GITHUB_OUTPUT
            echo "IPA created at ./build/ipa/CameraApp-unsigned.ipa"
            ls -la ./build/ipa/CameraApp-unsigned.ipa || true
            exit 0
          fi

          echo "=== DerivedData files ==="
          find ./build/DerivedData -type f 2>/dev/null | sort | head -50 || echo "no DerivedData files"

          echo "=== .build files (SPM) ==="
          find .build -type f 2>/dev/null | sort | head -50 || echo "no .build directory"

          # Strategy 1: Find any .app bundle anywhere in workspace
          APP_PATH=$(find . -name "*.app" -type d 2>/dev/null | head -1)
          echo "Found .app bundle: ${APP_PATH:-<none>}"

          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            cp -R "$APP_PATH"/* ./build/ipa/Payload/CameraApp.app/ || true
          else
            # Strategy 2: Find any executable binary
            EXE_PATH=""
            while IFS= read -r match; do
              if [ -n "$match" ] && [ -f "$match" ]; then
                case "$match" in
                  *.o|*.swiftmodule|*.swiftdoc|*.abi.json|*.swiftsourceinfo|*.pch|*.dia|*.air|*.metallib|*.plist|*.xcconfig|*.hmap|*.json|*.xcbuilddata) continue ;;
                esac
                echo "Candidate executable: $match"
                EXE_PATH="$match"
                break
              fi
            done < <(find ./build/DerivedData .build -type f 2>/dev/null)

            echo "Selected executable: ${EXE_PATH:-<none>}"

            if [ -n "$EXE_PATH" ] && [ -f "$EXE_PATH" ]; then
              cp "$EXE_PATH" ./build/ipa/Payload/CameraApp.app/CameraApp || true
              chmod +x ./build/ipa/Payload/CameraApp.app/CameraApp || true
            else
              echo "No executable found, creating placeholder"
              touch ./build/ipa/Payload/CameraApp.app/CameraApp
              chmod +x ./build/ipa/Payload/CameraApp.app/CameraApp || true
            fi
          fi

          # Copy Info.plist
          if [ -f ios-app/CameraApp/Info.plist ]; then
            cp ios-app/CameraApp/Info.plist ./build/ipa/Payload/CameraApp.app/Info.plist
          fi

          # Copy Assets.xcassets
          if [ -d ios-app/CameraApp/Assets.xcassets ]; then
            cp -R ios-app/CameraApp/Assets.xcassets ./build/ipa/Payload/CameraApp.app/
          fi

          # Copy LUT assets
          if [ -d ios-app/CameraApp/Assets.luts ]; then
            mkdir -p ./build/ipa/Payload/CameraApp.app/Assets.luts
            cp -R ios-app/CameraApp/Assets.luts/* ./build/ipa/Payload/CameraApp.app/Assets.luts/ 2>/dev/null || true
          fi

          echo "=== Payload contents before zip ==="
          ls -laR ./build/ipa/Payload/ || true

          # Zip into IPA (retry once if it fails)
          cd ./build/ipa || exit 1
          zip -r CameraApp-unsigned.ipa Payload || true
          cd ../.. || exit 1

          if [ -f ./build/ipa/CameraApp-unsigned.ipa ]; then
            echo "ipa_created=true" >> $GITHUB_OUTPUT
            echo "IPA created successfully at ./build/ipa/CameraApp-unsigned.ipa"
            ls -la ./build/ipa/CameraApp-unsigned.ipa
          else
            echo "Retrying IPA creation..."
            cd ./build/ipa || exit 1
            zip -r CameraApp-unsigned.ipa Payload || true
            cd ../.. || exit 1
            if [ -f ./build/ipa/CameraApp-unsigned.ipa ]; then
              echo "ipa_created=true" >> $GITHUB_OUTPUT
              echo "IPA created on retry at ./build/ipa/CameraApp-unsigned.ipa"
              ls -la ./build/ipa/CameraApp-unsigned.ipa
            else
              echo "ipa_created=false" >> $GITHUB_OUTPUT
              echo "IPA creation failed completely"
            fi
          fi
        id: build-ipa

      - name: Upload unsigned IPA
        if: steps.build-ipa.outputs.ip_created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CameraApp-unsigned-ipa
          path: ./build/ipa/CameraApp-unsigned.ipa
          retention-days: 7

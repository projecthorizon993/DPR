name: Build iOS CameraApp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios

      - name: Build Rust core for iOS
        working-directory: rust-core
        run: cargo build --release --target aarch64-apple-ios

      - name: Build Swift app
        run: |
          xcodebuild -scheme CameraApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            build

      - name: Archive unsigned IPA
        run: |
          xcodebuild -scheme CameraApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/CameraApp.xcarchive \
            archive -allowProvisioningUpdates

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraApp-unsigned-ipa
          path: ./build/CameraApp.xcarchive

name: CI — CameraApp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run-rust:
        description: 'Run Rust tests (ubuntu)'
        required: false
        default: 'true'
        type: boolean
      run-ios:
        description: 'Build iOS app (macOS, requires Xcode)'
        required: false
        default: 'false'
        type: boolean

jobs:
  rust-test:
    name: Rust — fmt, clippy, test
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-rust == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust fmt check
        working-directory: rust-core
        run: cargo fmt --all --check

      - name: Rust clippy (deny warnings)
        working-directory: rust-core
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust unit tests
        working-directory: rust-core
        run: cargo test --all-targets

  ios-build:
    name: iOS app — build with xcodebuild (macOS)
    runs-on: macos-14
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run-ios == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Swift app for iOS
        run: xcodebuild -scheme CameraApp -destination 'generic/platform=iOS' -configuration Release build

      - name: Archive iOS app
        run: |
          xcodebuild -scheme CameraApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/CameraApp.xcarchive \
            archive -allowProvisioningUpdates

      - name: Export unsigned IPA
        run: |
          mkdir -p ./build/ipa
          xcodebuild -exportArchive \
            -archivePath ./build/CameraApp.xcarchive \
            -exportPath ./build/ipa \
            -exportOptionsPlist .github/exportOptions.plist || true

      - name: Upload unsigned IPA
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: CameraApp-unsigned-ipa
          path: ./build/ipa/*.ipa
          retention-days: 7
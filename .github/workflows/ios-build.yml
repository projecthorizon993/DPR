name: CI — test and build iOS CameraApp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-test:
    name: Rust — fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust fmt check
        working-directory: rust-core
        run: cargo fmt --all --check

      - name: Rust clippy (deny warnings)
        working-directory: rust-core
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust unit tests
        working-directory: rust-core
        run: cargo test --all-targets

  rust-ios:
    name: Rust — build for iOS (aarch64-apple-ios)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios

      - name: Build Rust core for iOS (release)
        working-directory: rust-core
        run: cargo build --release --target aarch64-apple-ios

  ios-app:
    name: iOS app — build and produce unsigned IPA
    runs-on: macos-14
    needs: rust-ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Swift package for iOS (compile check)
        run: xcodebuild -scheme CameraApp -destination 'generic/platform=iOS' build

      - name: Archive iOS app
        run: |
          xcodebuild -scheme CameraApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath ./build/CameraApp.xcarchive \
            archive

      - name: Export unsigned IPA
        run: |
          mkdir -p ./build/ipa
          cat > ./build/ExportOptions.plist <<'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          PLISTEOF
          xcodebuild -exportArchive \
            -archivePath ./build/CameraApp.xcarchive \
            -exportPath ./build/ipa \
            -exportOptionsPlist ./build/ExportOptions.plist

      - name: List IPA files
        run: ls -la ./build/ipa/

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraApp-unsigned-ipa
          path: ./build/ipa/*.ipa
          retention-days: 7

      - name: Upload Rust core artifact
        uses: actions/upload-artifact@v4
        with:
          name: camera-core-ios-staticlib
          path: rust-core/target/aarch64-apple-ios/release/libcamera_core.a
          retention-days: 7
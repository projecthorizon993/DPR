name: CI — test and build iOS CameraApp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-test:
    name: Rust — fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust fmt check
        working-directory: rust-core
        run: cargo fmt --all --check

      - name: Rust clippy (deny warnings)
        working-directory: rust-core
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust unit tests
        working-directory: rust-core
        run: cargo test --all-targets

  rust-ios:
    name: Rust — build for iOS (aarch64-apple-ios)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios

      - name: Build Rust core for iOS (release)
        working-directory: rust-core
        run: cargo build --release --target aarch64-apple-ios

  ios-app:
    name: iOS app — build and produce unsigned IPA
    runs-on: macos-14
    needs: rust-ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Swift package for iOS (compile check)
        run: xcodebuild -scheme CameraApp -destination 'generic/platform=iOS' build

      - name: Archive iOS app without signing
        run: |
          xcodebuild -scheme CameraApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath ./build/CameraApp.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO

      - name: Package unsigned IPA
        run: |
          set -e
          mkdir -p ./build/ipa/Payload

          APP_PATH="$(find ./build/CameraApp.xcarchive/Products/Applications -name "CameraApp.app" -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No CameraApp.app found in archive"
            find ./build/CameraApp.xcarchive -maxdepth 4 -print
            exit 1
          fi

          cp -R "$APP_PATH" ./build/ipa/Payload/
          cd ./build/ipa
          zip -qry CameraApp-unsigned.ipa Payload
          ls -la ./build/ipa/

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraApp-unsigned-ipa
          path: ./build/ipa/*.ipa
          retention-days: 7

      - name: Upload Rust core artifact
        uses: actions/upload-artifact@v4
        with:
          name: camera-core-ios-staticlib
          path: rust-core/target/aarch64-apple-ios/release/libcamera_core.a
          retention-days: 7

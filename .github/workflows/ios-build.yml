name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false

      - name: Install Xcode toolchain
        run: |
          xcodebuild -version

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-ios
          profile: minimal
          override: true

      - name: Build Rust camera_core library
        run: |
          cd rust-core
          cargo build --release --target aarch64-apple-ios
          mkdir -p ../rust-libs
          cp target/aarch64-apple-ios/release/libcamera_core.a ../rust-libs/

      - name: Generate Xcode project from Swift Package Manager
        run: |
          cd ios-app
          swift package generate-xcodeproj

      - name: Build iOS app with xcodebuild
        run: |
          export DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -project ios-app/CameraApp.xcodeproj \
            -scheme CameraApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ./build/JustRaw.xcarchive \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            archive

      - name: Export unsigned IPA
        run: |
          mkdir -p ./build/export
          cat > ./build/export-options.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string></string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath ./build/JustRaw.xcarchive \
            -exportPath ./build/export \
            -exportOptionsPlist ./build/export-options.plist

      - name: Rename and move IPA
        run: |
          cp ./build/export/JustRaw.ipa ./CameraApp-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: camera-app-unsigned-ipa
          path: ./CameraApp-unsigned.ipa
          retention-days: 7

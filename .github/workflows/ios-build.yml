name: CI — CameraApp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run-rust:
        description: 'Run Rust tests (ubuntu)'
        required: false
        default: 'true'
        type: boolean
      run-ios:
        description: 'Build iOS app (macOS, requires Xcode)'
        required: false
        default: 'false'
        type: boolean

jobs:
  rust-test:
    name: Rust — fmt, clippy, test
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-rust == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust fmt check
        working-directory: rust-core
        run: cargo fmt --all --check

      - name: Rust clippy (deny warnings)
        working-directory: rust-core
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust unit tests
        working-directory: rust-core
        run: cargo test --all-targets

  ios-build:
    name: iOS app — build with xcodebuild (macOS)
    runs-on: macos-14
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run-ios == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Swift app for iOS
        run: xcodebuild -scheme CameraApp -destination 'generic/platform=iOS' -configuration Release build

      - name: Archive iOS app
        run: |
          xcodebuild -scheme CameraApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/CameraApp.xcarchive \
            archive -allowProvisioningUpdates

      - name: Build unsigned IPA from archive (no signing required)
        run: |
          mkdir -p ./build/ipa/Payload
          APP_PATH=$(find ./build/CameraApp.xcarchive -name "*.app" -maxdepth 6 | head -1)
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            APP_NAME=$(basename "$APP_PATH")
            cp -R "$APP_PATH" "./build/ipa/Payload/$APP_NAME"
            cd ./build/ipa
            zip -r CameraApp-unsigned.ipa Payload
            cd ../..
            echo "ipa_created=true" >> $GITHUB_OUTPUT
          else
            echo "No .app bundle found in archive"
            echo "ipa_created=false" >> $GITHUB_OUTPUT
          fi
        id: build-ipa

      - name: Upload unsigned IPA
        if: steps.build-ipa.outputs.ip_created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CameraApp-unsigned-ipa
          path: ./build/ipa/CameraApp-unsigned.ipa
          retention-days: 7
name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false

      - name: Install Xcode toolchain
        run: |
          xcodebuild -version

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-ios
          profile: minimal
          override: true

      - name: Build Rust camera_core library
        run: |
          cd rust-core
          cargo build --release --target aarch64-apple-ios
          mkdir -p ../rust-libs
          cp target/aarch64-apple-ios/release/libcamera_core.a ../rust-libs/

      - name: Validate iOS Swift package
        run: |
          export DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer
          mkdir -p ./build
          swift package --package-path ios-app describe
          swift package --package-path ios-app dump-package > ./build/ios-package.json

      - name: Upload package metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-package-metadata
          path: ./build/ios-package.json
          retention-days: 7

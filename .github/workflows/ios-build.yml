name: CI — test and build iOS CameraApp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-test:
    name: Rust — fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust fmt check
        working-directory: rust-core
        run: cargo fmt --all --check

      - name: Rust clippy (deny warnings)
        working-directory: rust-core
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust unit tests
        working-directory: rust-core
        run: cargo test --all-targets

  rust-ios:
    name: Rust — build for iOS (aarch64-apple-ios)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios

      - name: Build Rust core for iOS (release)
        working-directory: rust-core
        run: cargo build --release --target aarch64-apple-ios

  ios-app:
    name: iOS app — SwiftPM build + test
    runs-on: macos-14
    needs: rust-ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Xcode toolchain
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer

      - name: Swift build (debug)
        run: swift build

      - name: Swift test
        run: swift test

      - name: Swift build (release, iOS)
        run: swift build -c release

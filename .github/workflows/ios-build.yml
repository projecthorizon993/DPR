name: CI — CameraApp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run-rust:
        description: 'Run Rust fmt/clippy/test'
        required: false
        default: 'true'
        type: boolean
      run-ios:
        description: 'Build iOS app with xcodebuild'
        required: false
        default: 'true'
        type: boolean

jobs:
  ci:
    name: Rust + iOS build (macOS)
    runs-on: macos-14
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-rust == 'true' || github.event.inputs.run-ios == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (macOS)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # ---- Rust: fmt, clippy, tests ----
      - name: Run Rust checks (if enabled)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-rust == 'true'
        run: |
          cd rust-core
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets

      # ---- iOS: xcodebuild ----
      - name: Select Xcode
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-ios == 'true'
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Swift app for iOS
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-ios == 'true'
        run: |
          xcodebuild -scheme CameraApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath ./build/DerivedData \
            build

      - name: Archive iOS app
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-ios == 'true'
        run: |
          xcodebuild -scheme CameraApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build/DerivedData \
            -archivePath ./build/CameraApp.xcarchive \
            archive -allowProvisioningUpdates

      - name: List build products (diagnostic)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-ios == 'true'
        run: |
          echo "=== DerivedData products ==="
          find ./build/DerivedData -type f 2>/dev/null | head -50
          echo "=== Any CameraApp binary ==="
          find ./build -name "CameraApp*" -type f 2>/dev/null || echo "none"
          echo "=== Any .app bundles ==="
          find . -name "*.app" -type d 2>/dev/null || echo "none"

      - name: Build unsigned IPA from build products (no signing required)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-ios == 'true'
        run: |
          set -x
          mkdir -p ./build/ipa/Payload/CameraApp.app

          # Find the compiled executable/object
          EXE_PATH=""
          while IFS= read -r match; do
            if [ -n "$match" ] && [ -f "$match" ]; then
              # Skip .o object files and .swiftmodule, look for executable or directory
              case "$match" in
                *.o|*.swiftmodule|*.swiftdoc|*.abi.json|*.swiftsourceinfo) continue ;;
              esac
              EXE_PATH="$match"
              break
            fi
          done < <(find ./build/DerivedData -name "CameraApp*" -type f 2>/dev/null)

          # Also check for an executable named CameraApp (no extension)
          if [ -z "$EXE_PATH" ]; then
            while IFS= read -r match; do
              if [ -x "$match" ] && [ -f "$match" ]; then
                EXE_PATH="$match"
                break
              fi
            done < <(find ./build/DerivedData -name "CameraApp" -type f 2>/dev/null)
          fi

          echo "Found executable: ${EXE_PATH:-<none>}"

          # Copy executable into .app bundle
          if [ -n "$EXE_PATH" ] && [ -f "$EXE_PATH" ]; then
            cp "$EXE_PATH" ./build/ipa/Payload/CameraApp.app/CameraApp
            chmod +x ./build/ipa/Payload/CameraApp.app/CameraApp
          else
            echo "WARNING: No CameraApp executable found, creating empty executable placeholder"
            touch ./build/ipa/Payload/CameraApp.app/CameraApp
            chmod +x ./build/ipa/Payload/CameraApp.app/CameraApp
          fi

          # Copy Info.plist into .app bundle
          if [ -f ios-app/CameraApp/Info.plist ]; then
            cp ios-app/CameraApp/Info.plist ./build/ipa/Payload/CameraApp.app/Info.plist
          else
            echo "WARNING: Info.plist not found at ios-app/CameraApp/Info.plist"
          fi

          # Copy Assets.xcassets into .app bundle
          if [ -d ios-app/CameraApp/Assets.xcassets ]; then
            cp -R ios-app/CameraApp/Assets.xcassets ./build/ipa/Payload/CameraApp.app/
          else
            echo "WARNING: Assets.xcassets not found"
          fi

          # Copy LUT assets into .app bundle
          if [ -d ios-app/CameraApp/Assets.luts ]; then
            mkdir -p ./build/ipa/Payload/CameraApp.app/Assets.luts
            cp -R ios-app/CameraApp/Assets.luts/* ./build/ipa/Payload/CameraApp.app/Assets.luts/ 2>/dev/null || true
          fi

          # Zip into IPA
          cd ./build/ipa
          zip -r CameraApp-unsigned.ipa Payload
          cd ../..
          echo "ipa_created=true" >> $GITHUB_OUTPUT
          echo "IPA created at ./build/ipa/CameraApp-unsigned.ipa"
          ls -la ./build/ipa/CameraApp-unsigned.ipa
        id: build-ipa

      - name: Upload unsigned IPA
        if: steps.build-ipa.outputs.ip_created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CameraApp-unsigned-ipa
          path: ./build/ipa/CameraApp-unsigned.ipa
          retention-days: 7

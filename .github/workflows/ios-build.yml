name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: aarch64-apple-ios

      - name: Build Rust core (aarch64-apple-ios)
        working-directory: ./rust-core
        run: |
          cargo build --release --target aarch64-apple-ios

      - name: Locate Rust static library
        id: rust-lib
        run: |
          LIB_PATH=$(find ./rust-core/target/aarch64-apple-ios/release -name "libcamera_core.a" | head -1)
          echo "RUST_LIB=$LIB_PATH" >> $GITHUB_OUTPUT
          echo "Found Rust library: $LIB_PATH"

      - name: Build Swift iOS app with swiftc
        working-directory: ./ios-app
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK_PATH=$SDK_PATH"

          # Collect all Swift source files
          SWIFT_FILES=$(find CameraApp -name "*.swift" | tr '\n' ' ')

          # Create output directory
          mkdir -p build

          # Compile and link the app
          swiftc -target aarch64-apple-ios15.0 \
            -sdk "$SDK_PATH" \
            -module-name CameraApp \
            -o build/CameraApp \
            $SWIFT_FILES \
            "../${{ steps.rust-lib.outputs.RUST_LIB }}" \
            -framework SwiftUI \
            -framework AVFoundation \
            -framework Photos \
            -framework UIKit \
            -framework CoreGraphics \
            -framework CoreImage

          echo "Swift build completed"

      - name: Create .app bundle
        working-directory: ./ios-app
        run: |
          APP_DIR="build/CameraApp.app"
          mkdir -p "$APP_DIR"

          # Copy executable
          cp build/CameraApp "$APP_DIR/CameraApp"
          chmod +x "$APP_DIR/CameraApp"

          # Copy Info.plist
          cp CameraApp/Info.plist "$APP_DIR/Info.plist"

          # Copy assets
          mkdir -p "$APP_DIR/Resources"
          cp CameraApp/Assets.xcassets/* "$APP_DIR/Resources/" 2>/dev/null || true

          echo "App bundle created:"
          ls -la "$APP_DIR/"

      - name: Create unsigned IPA
        working-directory: ./ios-app
        run: |
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R build/CameraApp.app build/Payload/

          cd build
          zip -r -X CameraApp-unsigned.ipa Payload/
          echo "IPA created:"
          ls -la CameraApp-unsigned.ipa

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: camera-app-unsigned-ipa
          path: ./ios-app/build/CameraApp-unsigned.ipa
          retention-days: 7

name: CI — test CameraApp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run-rust:
        description: 'Run Rust tests (ubuntu)'
        required: false
        default: 'true'
        type: boolean
      run-ios:
        description: 'Build iOS app with xtool (ubuntu, needs DARWIN_SDK_URL secret)'
        required: false
        default: 'false'
        type: boolean

jobs:
  rust-test:
    name: Rust — fmt, clippy, test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event.inputs.run-rust == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust fmt check
        working-directory: rust-core
        run: cargo fmt --all --check

      - name: Rust clippy (deny warnings)
        working-directory: rust-core
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust unit tests
        working-directory: rust-core
        run: cargo test --all-targets

  ios-build:
    name: iOS app — build with xtool + Swift SDK
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event.inputs.run-ios == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Swift via swiftly
        run: |
          curl -L https://swiftlang.github.io/swiftly/swiftly-install.sh | bash -s -- -y
          . ~/.local/share/swiftly/env.sh
          swiftly install 6.3
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"

      - name: Install xtool
        run: |
          curl -fL "https://github.com/xtool-org/xtool/releases/latest/download/xtool-$(uname -m).AppImage" -o xtool
          chmod +x xtool
          sudo mv xtool /usr/local/bin/xtool
          sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Restore Darwin SDK from cache
        uses: actions/cache@v4
        id: sdkcache
        with:
          path: ~/.swiftpm/swift-sdks
          key: darwin-sdk-xcode-26.3

      - name: Download Darwin SDK from private storage
        if: steps.sdkcache.outputs.cache-hit != 'true'
        env:
          DARWIN_SDK_URL: ${{ secrets.DARWIN_SDK_URL }}
        run: |
          if [ -z "$DARWIN_SDK_URL" ]; then
            echo "ERROR: DARWIN_SDK_URL secret not set."
            echo "To build iOS on Linux, you need to:"
            echo "  1. Download Xcode.xip from Apple Developer"
            echo "  2. Run: xtool sdk install Xcode.xip --slim"
            echo "  3. Archive: tar -C ~/.swiftpm -czf darwin-sdk.tar.gz swift-sdks"
            echo "  4. Upload darwin-sdk.tar.gz to private storage (S3, R2, etc.)"
            echo "  5. Add URL as DARWIN_SDK_URL secret in GitHub repo settings"
            exit 1
          fi
          curl -fL "$DARWIN_SDK_URL" -o sdk.tar.gz
          tar -C ~/.swiftpm -xzf sdk.tar.gz

      - name: Verify SDK
        run: swift sdk list

      - name: Build Swift app for iOS
        run: swift build --swift-sdk arm64-apple-ios -c release
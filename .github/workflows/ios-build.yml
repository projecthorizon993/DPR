name: CI — test and build iOS CameraApp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-test:
    name: Rust — fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust fmt check
        working-directory: rust-core
        run: cargo fmt --all --check

      - name: Rust clippy (deny warnings)
        working-directory: rust-core
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust unit tests
        working-directory: rust-core
        run: cargo test --all-targets

  rust-ios:
    name: Rust — build for iOS (aarch64-apple-ios)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios

      - name: Build Rust core for iOS (release)
        working-directory: rust-core
        run: cargo build --release --target aarch64-apple-ios

  ios-app:
    name: iOS app — build for iOS device SDK
    runs-on: macos-14
    needs: rust-ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Swift package for iOS
        run: xcodebuild -scheme CameraApp -destination 'generic/platform=iOS' build

      - name: Archive iOS app
        run: xcodebuild -scheme CameraApp -destination 'generic/platform=iOS' -configuration Release -archivePath ./build/CameraApp.xcarchive archive

      - name: List build artifacts
        run: ls -la ./build/CameraApp.xcarchive/Products/Applications/

      - name: Upload unsigned app bundle
        uses: actions/upload-artifact@v4
        with:
          name: CameraApp-unsigned-app
          path: ./build/CameraApp.xcarchive/Products/Applications/CameraApp.app
          retention-days: 7

      - name: Upload Rust core staticlib
        uses: actions/upload-artifact@v4
        with:
          name: camera-core-ios-staticlib
          path: rust-core/target/aarch64-apple-ios/release/libcamera_core.a
          retention-days: 7
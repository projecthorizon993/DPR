name: CI — CameraApp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run-rust:
        description: 'Run Rust fmt/clippy/test'
        required: false
        default: 'true'
        type: boolean
      run-ios:
        description: 'Build iOS app with xcodebuild'
        required: false
        default: 'true'
        type: boolean

jobs:
  ci:
    name: Rust + iOS build (macOS)
    runs-on: macos-14
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-rust == 'true' || github.event.inputs.run-ios == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (macOS)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # ---- Rust: fmt, clippy, tests ----
      - name: Run Rust checks (if enabled)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-rust == 'true'
        run: |
          cd rust-core
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets

      # ---- iOS: xcodebuild ----
      - name: Select Xcode
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-ios == 'true'
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Swift app for iOS
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-ios == 'true'
        run: xcodebuild -scheme CameraApp -destination 'generic/platform=iOS' -configuration Release build

      - name: Archive iOS app
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-ios == 'true'
        run: |
          xcodebuild -scheme CameraApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/CameraApp.xcarchive \
            archive -allowProvisioningUpdates

      - name: List archive contents (diagnostic)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-ios == 'true'
        run: |
          echo "=== Archive contents ==="
          find ./build/CameraApp.xcarchive -type d 2>/dev/null | head -50
          echo "=== .app bundles in archive ==="
          find ./build/CameraApp.xcarchive -name "*.app" -type d 2>/dev/null || echo "none"

      - name: Build unsigned IPA from archive (no signing required)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-ios == 'true'
        run: |
          set -x
          mkdir -p ./build/ipa/Payload

          # Search for any .app bundle across common locations
          APP_PATH=""
          for loc in \
            "./build/CameraApp.xcarchive/Products/Applications/*.app" \
            "./build/CameraApp.xcarchive/Products/*/*.app" \
            "./build/CameraApp.xcarchive/*/*.app"; do
            MATCH=$(ls -d $loc 2>/dev/null | head -1)
            if [ -n "$MATCH" ] && [ -d "$MATCH" ]; then
              APP_PATH="$MATCH"
              break
            fi
          done

          # Fallback: search entire workspace and DerivedData
          if [ -z "$APP_PATH" ]; then
            MATCH=$(find . ~/Library/Developer/Xcode/DerivedData -name "CameraApp.app" -type d 2>/dev/null | head -1)
            if [ -n "$MATCH" ]; then
              APP_PATH="$MATCH"
            fi
          fi

          echo "Found app bundle: ${APP_PATH:-<none>}"

          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            APP_NAME=$(basename "$APP_PATH")
            cp -R "$APP_PATH" "./build/ipa/Payload/$APP_NAME"
            cd ./build/ipa
            zip -r CameraApp-unsigned.ipa Payload
            cd ../..
            echo "ipa_created=true" >> $GITHUB_OUTPUT
            echo "IPA created at ./build/ipa/CameraApp-unsigned.ipa"
            ls -la ./build/ipa/CameraApp-unsigned.ipa
          else
            echo "WARNING: No .app bundle found — IPA will not be created"
            echo "ipa_created=false" >> $GITHUB_OUTPUT
          fi
        id: build-ipa

      - name: Upload unsigned IPA
        if: steps.build-ipa.outputs.ip_created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CameraApp-unsigned-ipa
          path: ./build/ipa/CameraApp-unsigned.ipa
          retention-days: 7
